_ > nanoagent.plugin.v0001.ManifestConfig:
id: av-maze-path
name: Maze Path
version: 0.1.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_maze:
    description: Show a maze by its id as rows of text, with its width and height
  walk:
    description: Follow a string of U, D, L, R moves from the start and report where the walk stops
  maze_record:
    description: The maze itself, pinned as the verifier's reference to compute the true shortest path

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  get-maze:
    description: Show a maze
    runner: tool
    tools: [get_maze]
    reference: null
    instructions: Return the maze with this id.
  solve-maze:
    description: Find the shortest path through a maze, or show there is none
    runner: agent
    tools: [get_maze, walk]
    reference: maze_record
    instructions: |-
      Read the maze with get_maze. Rows are listed top first; # is a wall, . is open floor, S is the start and G is the goal. You move one cell at a time up (U), down (D), left (L) or right (R), never into a wall.
      Find the shortest path from S to G, or decide that G cannot be reached at all. Use walk to test a path before you submit it.
      You have a budget of 12 tool calls in all, get_maze included; after that every tool fails. Plan the path by reasoning over the rows instead of testing moves one by one.
      Submit reachable and the moves of a shortest path as one string such as RRDDL, or reachable false with empty moves.
      Every reply must be a tool call: never answer with text alone, or the run ends with nothing submitted. When you are done, stuck, or near the end of your budget, call submit. Set gave_up to false when you believe your answer is right; if you could not solve it, set gave_up to true and submit your best attempt, or empty values.
